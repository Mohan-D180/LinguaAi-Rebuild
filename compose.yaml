services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    init: true
    environment:
      APP_NAME: LinguaAi
      API_VERSION: v1
      LOG_LEVEL: ${BACKEND_LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    expose:
      - "8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/main.py:/app/main.py:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
    networks:
      - app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    init: true
    environment:
      NODE_ENV: development
      API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_npm_cache:/home/node/.npm
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 5
    networks:
      - app

volumes:
  frontend_node_modules:
  frontend_npm_cache:

networks:
  app:
    driver: bridge
